<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dükkan Takip</title>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dükkan">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="ikon/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikon/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ust">
    <a href="#/" class="logo" id="dukkanAdi">Dükkan Takip</a>
    <nav class="menu">
      <a href="#/" data-sayfa="ozet">Özet</a>
      <a href="#/cariler" data-sayfa="cariler">Cariler</a>
      <a href="#/stok" data-sayfa="stok">Stok</a>
      <a href="#/ayarlar" data-sayfa="ayarlar">Ayarlar</a>
    </nav>
  </header>
  <main id="icerik"></main>
  <nav class="alt-menu">
    <a href="#/" data-sayfa="ozet"><span>🏠</span>Özet</a>
    <a href="#/cariler" data-sayfa="cariler"><span>👥</span>Cariler</a>

  </nav>
  <dialog id="tarayici" class="tarayici">
    <div class="tarayici-ust"><b id="tarayiciBaslik">Barkodu okutun</b><button type="button" class="ikincil kucuk" id="tarayiciKapat">Kapat ✕</button></div>
    <div class="tarayici-video"><video id="tarayiciVideo" playsinline muted autoplay></video><div class="tarayici-cizgi"></div></div>
    <div id="tarayiciSon" class="tarayici-son"></div>
    <form id="tarayiciElle" class="arac" style="margin:8px 0 0"><input id="tarayiciKod" inputmode="numeric" placeholder="Okumuyorsa barkodu yazın"><button type="submit">Tamam</button></form>
  </dialog>
  <dialog id="pencere"><form method="dialog" id="pencereForm"></form></dialog>
  <div id="bildirim"></div>
  <script src="veri.js"></script>
  <script src="app.js"></script>
</body>
</html>
